# ==============================================================================
# MedGuide Backend - Test Configuration
# ==============================================================================

spring:
  application:
    name: medguide-backend
  profiles:
    active: test

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medguide_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

app:
  jwt:
    # Test-only 256+ bit HMAC-SHA256 secret (base64 encoded)
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1tZWRndWlkZS1hdXRoZW50aWNhdGlvbi10ZXN0cy1vbmx5
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age-secs: 3600
